<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="star-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f5f3ff" />
      <stop offset="100%" stop-color="#ddd6fe" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#c4b5fd" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4c1d95" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Rounded Square / Squircle Container with Soft Shadow -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg-grad)" filter="url(#soft-shadow)" />

  <!-- Subtle Inner Border for Depth -->
  <rect x="9" y="9" width="110" height="110" rx="27" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Radial Glow Behind the Sparkle -->
  <circle cx="64" cy="64" r="38" fill="url(#glow)" />

  <!-- Glowing Four-Point Celestial Sparkle / Star -->
  <path
    d="M 64 22
       C 64 45 45 64 22 64
       C 45 64 64 83 64 106
       C 64 83 83 64 106 64
       C 83 64 64 45 64 22 Z"
    fill="url(#star-grad)"
  />

  <!-- Secondary Diagonal Subtle Glints for Radiance -->
  <path
    d="M 64 42
       C 64 54 54 64 42 64
       C 54 64 64 74 64 86
       C 64 74 74 64 86 64
       C 74 64 64 54 64 42 Z"
    fill="#ffffff"
    opacity="0.6"
    transform="rotate(45 64 64)"
  />

  <!-- Center Shimmer Core -->
  <circle cx="64" cy="64" r="3.5" fill="#ffffff" />
</svg>
